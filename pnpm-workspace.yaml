packages:
  - "apps/*"
  - "packages/*"

# trusted packages allowed to run postinstall scripts
onlyBuiltDependencies:
  - "@prisma/engines"
  - prisma
  - esbuild

# Supply chain (OWASP A03): pin transitive deps to advisory-free versions.
# - postcss <8.4.31 fix: GHSA-qx2v-qp2m-jg93 (ReDoS), pulled in by next
# - @hono/node-server <2.0.5 fix: GHSA-frvp-7c67-39w9, dev-only tooling
# - brace-expansion <5.0.8 fix: GHSA-mh99-v99m-4gvg (ReDoS)
# - fast-uri <3.1.4 fix: GHSA-v2hh-gcrm-f6hx
# - sharp <0.35.0 fix: GHSA-f88m-g3jw-g9cj, optional dep of next
# - valibot <1.4.2 fix: GHSA-5qjj-4xww-7phc, pulled in by @prisma/dev
overrides:
  postcss: "^8.5.19"
  "@hono/node-server": "^2.0.5"
  brace-expansion: "^5.0.8"
  fast-uri: "^3.1.4"
  sharp: "^0.35.0"
  valibot: "^1.4.2"
